# Compila el APK de la pizarra y lo deja en el release «ultimo», con un enlace
# directo que se instala tocándolo desde el teléfono. Es el mismo camino que la
# app de la Hilux, recortado: acá no hay Flutter, es Gradle y Kotlin a secas.

name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # La verificación previa no es opcional (PROTOCOLO-GENERAL § 2.1 ter):
      # si el banco falla, no se construye nada.
      - name: Banco de pruebas
        run: ./gradlew --no-daemon test

      # Si el banco falla, qué prueba y por qué, como anotación de la corrida:
      # el registro entero no se puede leer desde un chat, las anotaciones sí.
      - name: Qué prueba falló
        if: failure()
        run: |
          for f in app/build/test-results/*/TEST-*.xml; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for c in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for x in list(c.findall("failure")) + list(c.findall("error")):
                  m = (x.get("message") or "") + " | " + (x.text or "")[:600]
                  print("::error title=" + c.get("name") + "::" + m.replace("\n", " ").replace("\r", " ")[:900])
          PY
          done

      # ── LA FIRMA ─────────────────────────────────────────────────────────
      # Los mismos cuatro NOMBRES que la app de la Hilux (FIRMA_JKS,
      # FIRMA_STORE_PASS, FIRMA_KEY_PASS, FIRMA_ALIAS), con una clave PROPIA de
      # la pizarra (decidido el 5-oct-2026: la de la Hilux no se puede leer de
      # vuelta de GitHub, y no hace falta), cargados por Mauro a mano en
      # Settings → Secrets de ESTE repositorio. Paso a paso: README «La firma». Sin ellos se firma con
      # la clave de depuración, que cambia en cada corrida, y se avisa.
      - name: Preparar la firma
        id: firma
        env:
          FIRMA_JKS: ${{ secrets.FIRMA_JKS }}
          FIRMA_STORE_PASS: ${{ secrets.FIRMA_STORE_PASS }}
          FIRMA_KEY_PASS: ${{ secrets.FIRMA_KEY_PASS }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
        run: |
          if [ -z "$FIRMA_JKS" ]; then
            echo "propia=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin FIRMA_JKS: se firma con la clave de depuración. Este APK NO se va a poder instalar encima del anterior."
            exit 0
          fi
          printf '%s' "$FIRMA_JKS" | tr -d '[:space:]' | base64 -d > app/firma.jks
          if ! "$JAVA_HOME/bin/keytool" -list -keystore app/firma.jks -storepass "$FIRMA_STORE_PASS" > /dev/null 2>&1; then
            echo "::error::El keystore de FIRMA_JKS no abre con FIRMA_STORE_PASS. Revisá que FIRMA_STORE_PASS sea la contraseña de pizarra.jks (README, «La firma»)."
            exit 1
          fi
          cat > key.properties <<PROPS
          storeFile=firma.jks
          storePassword=$FIRMA_STORE_PASS
          keyAlias=${FIRMA_ALIAS:-pizarra}
          keyPassword=${FIRMA_KEY_PASS:-$FIRMA_STORE_PASS}
          PROPS
          echo "propia=si" >> "$GITHUB_OUTPUT"

      - name: Construir APK
        run: ./gradlew --no-daemon assembleRelease -PcodigoVersion=${{ github.run_number }}

      - name: Publicar el último APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORRIDA: ${{ github.run_number }}
          FIRMA_PROPIA: ${{ steps.firma.outputs.propia }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk pizarra.apk
          if [ "$FIRMA_PROPIA" = "si" ]; then
            NOTA="Firmado con la clave propia: se instala encima de la versión anterior."
          else
            NOTA="⚠ Firmado con la clave de depuración: para instalarlo hay que desinstalar la anterior (se pierde sólo la sesión; lo elegido para la pizarra está en Tiempos)."
          fi
          cat > notas.md <<NOTAS
          ## Bajá \`pizarra.apk\`

          Se instala tocándolo desde el navegador del teléfono.

          $NOTA

          Corrida $CORRIDA, el $(date -u '+%Y-%m-%d %H:%M UTC').
          NOTAS
          gh release delete ultimo --yes --cleanup-tag || true
          gh release create ultimo --title "pizarra · corrida $CORRIDA" --notes-file notas.md --prerelease pizarra.apk
